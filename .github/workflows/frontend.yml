name: Frontend
on:
  pull_request:
    paths: ["frontend/**", "compose.yaml", ".github/workflows/frontend.yml"]
  push:
    paths: ["frontend/**", "compose.yaml", ".github/workflows/frontend.yml"]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
