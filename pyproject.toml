[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-explainer"
version = "0.1.0"
description = "Durable asynchronous Stockfish evaluation service"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "python-chess>=1.999,<2",
  "sqlalchemy[asyncio]>=2.0.30,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.alembic]
script_location = "migrations"
