name: chess-explainer

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://chess:chess@db:5432/chess}
  ENGINE_PATH: ${ENGINE_PATH:-/usr/games/stockfish}
  ENGINE_VERSION: ${ENGINE_VERSION:-stockfish-15.1-4}
  SEARCH_TIME_SECONDS: ${SEARCH_TIME_SECONDS:-1.0}
  HARD_ATTEMPT_TIMEOUT_SECONDS: ${HARD_ATTEMPT_TIMEOUT_SECONDS:-10.0}
  ENGINE_THREADS: ${ENGINE_THREADS:-1}
  ENGINE_HASH_MB: ${ENGINE_HASH_MB:-64}
  LEASE_SECONDS: ${LEASE_SECONDS:-30.0}
  POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-0.5}
  MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-4096}

x-test-environment: &test-environment
  DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+psycopg://chess_test:chess_test@test-db:5432/chess_test}
  ENGINE_PATH: /usr/games/stockfish
  ENGINE_VERSION: stockfish-15.1-4
  SEARCH_TIME_SECONDS: ${TEST_SEARCH_TIME_SECONDS:-0.2}
  HARD_ATTEMPT_TIMEOUT_SECONDS: ${TEST_HARD_ATTEMPT_TIMEOUT_SECONDS:-5.0}
  ENGINE_THREADS: "1"
  ENGINE_HASH_MB: "64"
  LEASE_SECONDS: ${TEST_LEASE_SECONDS:-15.0}
  POLL_INTERVAL_SECONDS: "0.1"
  MAX_REQUEST_BODY_BYTES: "4096"

services:
  db:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chess}
      POSTGRES_DB: ${POSTGRES_DB:-chess}
    volumes:
      - chess-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: runtime
    environment: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    environment: *app-environment
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: runtime
    environment: *app-environment
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 15s
    restart: unless-stopped

  test-db:
    image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
    profiles: ["test"]
    environment:
      POSTGRES_USER: chess_test
      POSTGRES_PASSWORD: chess_test
      POSTGRES_DB: chess_test
    volumes:
      - chess-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  test-migrate:
    build:
      context: .
      target: runtime
    profiles: ["test"]
    environment: *test-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      test-db:
        condition: service_healthy
    restart: "no"

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      <<: *test-environment
      RUN_CONTAINER_INTEGRATION: "1"
    depends_on:
      test-migrate:
        condition: service_completed_successfully
    command: ["pytest", "-q"]

volumes:
  chess-data:
    name: chess-explainer-data
  chess-test-data:
    name: chess-explainer-test-data
